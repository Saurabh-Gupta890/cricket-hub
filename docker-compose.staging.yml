version: '3.8'

services:
  crickethub-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crickethub-staging-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - DATA_DIR=/app/data-staging
    volumes:
      - staging_data:/app/data-staging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  staging_data:
    name: crickethub_staging_volume
